info:
  name: Store
  type: http
  seq: 2
  tags:
    - City
http:
  method: POST
  url: '{{baseUrl}}/api/cities'
  headers:
    -
      name: Accept
      value: application/json
    -
      name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: '{{authToken}}'
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
